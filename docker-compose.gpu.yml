# GPU sunucuda docker-compose.yml'e EK olarak uygulanır (host'ta NVIDIA driver +
# nvidia-container-toolkit kurulu olmalı; doğrulama:
# `docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Ayrıca sunucu/docker-data/config/config.yaml içinde model.device: "cuda:0" olmalı.
services:
  detector:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
