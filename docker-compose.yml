# Pull + run — BUILD YOK. İmajlar Docker Hub'dan çekilir:
#   themrgndzd/ppe-backend:latest, themrgndzd/ppe-detector:latest
# (push akışı için: sunucu/tools/docker-build-push.ps1, geliştirme makinesinde çalıştırılır)
#
# Bu dosya GPU'suz test makinesinde DE, GPU sunucuda DA aynı şekilde kullanılır;
# GPU sunucuda ek olarak docker-compose.gpu.yml uygulanır (aşağıya bakın).
#
# Kurulum (HER makinede bir kere, bu repo'nun kök dizininde):
#   1) cp .env.example .env
#      PG_*/BACKEND_API_KEY değerlerini kendi ürettiğiniz değerlerle doldurun.
#   2) mkdir -p sunucu/docker-data/config sunucu/docker-data/logs
#      cp sunucu/config.docker.yaml.example sunucu/docker-data/config/config.yaml
#      api_key'i .env'deki BACKEND_API_KEY ile AYNI yapın; GPU yoksa
#      model.device: "cpu" bırakın (GPU sunucuda "cuda:0" + docker-compose.gpu.yml).
#      echo "[]" > sunucu/docker-data/config/cameras.json
#
# Çalıştırma:
#   Test makinesi (CPU) : docker compose pull && docker compose up -d
#   GPU sunucu          : docker compose -f docker-compose.yml -f docker-compose.gpu.yml pull
#                          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Web arayüzü: http://localhost:8080  ·  Detector API: http://localhost:8090
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: themrgndzd/ppe-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${PG_DB}
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  detector:
    image: themrgndzd/ppe-detector:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PPE_CONFIG: /app/sunucu/config-data/config.yaml
    ports:
      - "8090:8090"
    volumes:
      - ./sunucu/docker-data/config:/app/sunucu/config-data
      - ./sunucu/docker-data/logs:/app/sunucu/logs/ihlal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  backend_storage:
